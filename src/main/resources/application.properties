server.port=8081

# MySQL data
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mydb?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA config
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# fenyexuliehua(Spring Boot 3)
spring.data.web.pageable.serialization-mode=via-dto

# Jackson config
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.visibility.field=any
spring.jackson.visibility.getter=any
spring.jackson.visibility.is-getter=any
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8

# ===============================
# Coze config
# ===============================
coze.token=${COZE_TOKEN:}
coze.workflow-id=${COZE_WORKFLOW_ID:}

# ===============================
# RAG service config
# ===============================
rag.service-url=${RAG_SERVICE_URL:http://127.0.0.1:5000}

# ===============================
# OpenAPI config
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
