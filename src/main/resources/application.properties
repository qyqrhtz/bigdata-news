server.port=8081

# MySQL data
spring.datasource.url=jdbc:mysql://localhost:3306/mydb?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA config
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# fenyexuliehua(Spring Boot 3)
spring.data.web.pageable.serialization-mode=via-dto

# Jackson config
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.visibility.field=any
spring.jackson.visibility.getter=any
spring.jackson.visibility.is-getter=any
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8

